services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: obrail
      POSTGRES_USER: obrail
      POSTGRES_PASSWORD: obrail
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obrail -d obrail"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  adminer:
    image: adminer:4.8.1
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      network: host
    image: obrail-backend:local
    command: ["/app/entrypoint.sh"]
    ports:
      - "8000:8000"
    environment:
      OBRAIL_DATASET_PATH: /app/data/eu_trips_v2.csv
      OBRAIL_MODELS_PATH: /app/models
      OBRAIL_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5199,http://127.0.0.1:5199
      DATABASE_URL: postgresql://obrail:obrail@db:5432/obrail
      CSV_PATH: /app/data/eu_trips_v2.csv
      DB_HOST: db
      DB_USER: obrail
      # Secret de signature JWT. La syntaxe ${VAR:-defaut} permet de le surcharger
      # depuis l environnement de l hote sans modifier ce fichier. La valeur par
      # defaut est explicitement nommee comme reservee au developpement.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      OBRAIL_VIEWER_USER: ${OBRAIL_VIEWER_USER:-viewer}
      OBRAIL_VIEWER_PASSWORD: ${OBRAIL_VIEWER_PASSWORD:-viewer123}
      OBRAIL_ADMIN_USER: ${OBRAIL_ADMIN_USER:-admin}
      OBRAIL_ADMIN_PASSWORD: ${OBRAIL_ADMIN_PASSWORD:-admin123}
      # --- Agent IA (C8) -------------------------------------------------------
      OBRAIL_LLM_PROVIDER: ${OBRAIL_LLM_PROVIDER:-auto}
      # OPENROUTER_API_KEY est volontairement absent du défaut : sans clé,
      # le mode auto bascule sur Ollama, conformément à la règle "aucun repli silencieux".
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OBRAIL_LLM_MODEL_OLLAMA: ${OBRAIL_LLM_MODEL_OLLAMA:-qwen3:8b}
      OBRAIL_LLM_MODEL_OPENROUTER: ${OBRAIL_LLM_MODEL_OPENROUTER:-openai/gpt-4o-mini}
      # host.docker.internal résolu via extra_hosts ci-dessous (Linux/WSL)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OBRAIL_AGENT_AUTO_TIMEOUT_S: ${OBRAIL_AGENT_AUTO_TIMEOUT_S:-1.5}
      OBRAIL_AGENT_AUTO_CACHE_S: ${OBRAIL_AGENT_AUTO_CACHE_S:-45}
      OBRAIL_AGENT_MAX_ITERATIONS: ${OBRAIL_AGENT_MAX_ITERATIONS:-5}
      OBRAIL_AGENT_TIMEOUT_S: ${OBRAIL_AGENT_TIMEOUT_S:-300}
      OBRAIL_AGENT_MAX_TOKENS: ${OBRAIL_AGENT_MAX_TOKENS:-800}
      OBRAIL_AGENT_TEMPERATURE: ${OBRAIL_AGENT_TEMPERATURE:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../data:/app/data:ro
      - ../models:/app/models:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      network: host
    image: obrail-frontend:local
    ports:
      - "5199:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Désactive le changement de mot de passe forcé au premier accès
      GF_SECURITY_DISABLE_INITIAL_ADMIN_PASSWORD_CHANGE: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ../monitoring/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../monitoring/promtail.yml:/etc/promtail/promtail.yml:ro
    command: -config.file=/etc/promtail/promtail.yml
    depends_on:
      loki:
        condition: service_healthy

volumes:
  grafana-data:
  loki-data:
  postgres-data:
